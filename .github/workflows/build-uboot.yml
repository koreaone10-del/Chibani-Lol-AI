name: Build R69 LPDDR3 U-Boot

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v3

    - name: 2. Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential gcc-arm-linux-gnueabihf bison flex bc device-tree-compiler libssl-dev python3 python-is-python3

    - name: 3. Clone U-Boot
      run: |
        git clone --depth 1 -b v2019.01 https://github.com/u-boot/u-boot.git u-boot-r69
        cd u-boot-r69
        grep -rl "python2" tools/ scripts/ | xargs sed -i 's/python2/python3/g' || true

    - name: 4. Configure U-Boot for R69
      run: |
        cd u-boot-r69
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- orangepi_one_defconfig
        
        # تعطيل الخصائص غير الضرورية
        sed -i 's/CONFIG_PYLIBFDT=y/# CONFIG_PYLIBFDT is not set/' .config || true
        sed -i 's/CONFIG_BINMAN=y/# CONFIG_BINMAN is not set/' .config || true
        
        # ضبط إعدادات الرامات الدقيقة (LPDDR3 @ 336MHz)
        sed -i 's/CONFIG_DRAM_CLK=.*/CONFIG_DRAM_CLK=336/' .config
        sed -i 's/CONFIG_DRAM_ZQ=.*/CONFIG_DRAM_ZQ=3750393/' .config
        sed -i 's/CONFIG_SUNXI_DRAM_DDR3=y/# CONFIG_SUNXI_DRAM_DDR3 is not set/' .config || true
        echo "CONFIG_SUNXI_DRAM_LPDDR3_STOCK=y" >> .config
        
        # تطبيق التغييرات
        make olddefconfig ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-
        
        echo "=== التحقق من الإعدادات ==="
        grep -E "DRAM_CLK|DRAM_ZQ|SUNXI_DRAM" .config

    - name: 5. Compile
      run: |
        cd u-boot-r69
        make -j$(nproc) ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- \
          NO_PYTHON=1 \
          HOSTCC="gcc -O2 -idirafter /usr/include -idirafter /usr/include/x86_64-linux-gnu -fcommon" \
          HOSTLDFLAGS="-fcommon" \
          u-boot-dtb.bin spl/sunxi-spl.bin
        
        # دمج SPL و U-Boot
        cp spl/sunxi-spl.bin u-boot-sunxi-with-spl.bin
        dd if=u-boot-dtb.bin of=u-boot-sunxi-with-spl.bin bs=1024 seek=32 conv=notrunc
        
        echo "=== حجم الملف النهائي ==="
        ls -lh u-boot-sunxi-with-spl.bin

    - name: 6. Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: R69-U-Boot-Final
        path: u-boot-r69/u-boot-sunxi-with-spl.bin
