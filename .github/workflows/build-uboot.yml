name: Build R69-EMCP v2.0 U-Boot (Allwinner H3 336MHz)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-uboot.yml'

jobs:
  build-uboot:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Install ARM Cross-Compiler & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            libc6-dev \
            bison \
            flex \
            bc \
            device-tree-compiler \
            libssl-dev \
            python3

      - name: 2. Clone U-Boot 2019.01 & Fix Python3 Print Syntax
        run: |
          git clone --depth 1 -b v2019.01 https://github.com/u-boot/u-boot.git u-boot-r69
          cd u-boot-r69

          # إصلاح خطأ yylloc في المترجمات الحديثة
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l* || true

          # تحويل جميع سكربتات بايثون الداخلية (tools/bintool و sunxi-tools) لتتطابق مع Python 3 (إضافة أقواس للـ print)
          find tools/ -type f -name "*.py" -exec sed -i 's/print \("[^"]*"\)/print(\1)/g' {} + || true
          find tools/ -type f -name "*.py" -exec sed -i "s/print \('[^']*'\)/print(\1)/g" {} + || true
          # إصلاح أي ملفات داخل tools/binnan أو tools/binman
          find . -type f -name "*.py" -exec sed -i 's/\bprint \([^()\n]*\)/print(\1)/g' {} + || true

      - name: 3. Configure R69-EMCP v2.0 (336MHz RAM & ZQ=0x003939f9)
        run: |
          cd u-boot-r69
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- orangepi_one_defconfig
          sed -i 's/CONFIG_DRAM_CLK=.*/CONFIG_DRAM_CLK=336/' .config
          sed -i 's/CONFIG_DRAM_ZQ=.*/CONFIG_DRAM_ZQ=3750393/' .config
          sed -i 's/CONFIG_PYLIBFDT=y/# CONFIG_PYLIBFDT is not set/' .config || true

      - name: 4. Compile u-boot-sunxi-with-spl.bin
        run: |
          cd u-boot-r69
          make -j$(nproc) \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            NO_PYTHON=1 \
            HOSTCC="gcc -O2 -idirafter /usr/include -idirafter /usr/include/x86_64-linux-gnu -fcommon" \
            HOSTLDFLAGS="-fcommon"

          ls -lh u-boot-sunxi-with-spl.bin

      - name: 5. Create Ready-to-Flash 1MB SD Unbrick Image
        run: |
          cd u-boot-r69
          dd if=/dev/zero of=R69_SD_Unbrick_Bootable.img bs=1M count=1
          dd if=u-boot-sunxi-with-spl.bin of=R69_SD_Unbrick_Bootable.img bs=1024 seek=8 conv=notrunc

      - name: 6. Upload Compiled Bootloader Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: R69-EMCP-v2-Bootloader-Package
          path: |
            u-boot-r69/u-boot-sunxi-with-spl.bin
            u-boot-r69/R69_SD_Unbrick_Bootable.img
