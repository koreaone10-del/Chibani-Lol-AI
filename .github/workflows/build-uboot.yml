name: Build R69-EMCP v2.0 U-Boot (Allwinner H3 336MHz)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-uboot.yml'

jobs:
  build-uboot:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            bison \
            flex \
            bc \
            device-tree-compiler \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pyelftools \
            python-is-python3

      - name: 2. Clone U-Boot 2019.01
        run: |
          git clone --depth 1 -b v2019.01 \
            https://github.com/u-boot/u-boot.git u-boot-r69

      - name: 3. Patch Legacy Python Syntax
        run: |
          cd u-boot-r69

          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path("tools/binman/binman"),
          ]

          targets += list(Path("tools/binman").rglob("*.py"))

          for path in targets:
              if not path.is_file():
                  continue

              try:
                  text = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue

              original = text

              # Convert simple Python 2 print statements:
              # print value -> print(value)
              lines = []
              for line in text.splitlines(keepends=True):
                  match = re.match(
                      r'^(\s*)print\s+(.+?)(\s*)$',
                      line.rstrip("\r\n")
                  )

                  if match:
                      indent, expression, trailing = match.groups()
                      if not expression.startswith("("):
                          ending = line[len(line.rstrip("\r\n")):]
                          line = (
                              indent + "print(" + expression + ")"
                              + trailing + ending
                          )

                  lines.append(line)

              text = "".join(lines)

              if text != original:
                  path.write_text(text)
                  print("Patched:", path)

          # Confirm the main script now parses with Python 3.
          import ast
          ast.parse(Path("tools/binman/binman").read_text())
          print("binman Python 3 syntax check passed")
          PY

          # Fix the known device-tree lexer declaration if present.
          if [ -f scripts/dtc/dtc-lexer.l ]; then
            sed -i \
              's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' \
              scripts/dtc/dtc-lexer.l
          fi

      - name: 4. Configure Orange Pi One for Allwinner H3
        run: |
          cd u-boot-r69

          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- \
            orangepi_one_defconfig

          grep -q '^CONFIG_DRAM_CLK=' .config \
            && sed -i 's/^CONFIG_DRAM_CLK=.*/CONFIG_DRAM_CLK=336/' .config \
            || echo 'CONFIG_DRAM_CLK=336' >> .config

          grep -q '^CONFIG_DRAM_ZQ=' .config \
            && sed -i 's/^CONFIG_DRAM_ZQ=.*/CONFIG_DRAM_ZQ=3750393/' .config \
            || echo 'CONFIG_DRAM_ZQ=3750393' >> .config

          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig

      - name: 5. Compile U-Boot
        run: |
          cd u-boot-r69

          make -j"$(nproc)" \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            HOSTCC="gcc -O2 -fcommon" \
            HOSTLDFLAGS="-fcommon"

          test -s u-boot-sunxi-with-spl.bin
          ls -lh u-boot-sunxi-with-spl.bin

      - name: 6. Create SD Bootloader Image
        run: |
          cd u-boot-r69

          test -s u-boot-sunxi-with-spl.bin

          dd if=/dev/zero \
            of=R69_SD_Unbrick_Bootable.img \
            bs=1M count=1

          dd if=u-boot-sunxi-with-spl.bin \
            of=R69_SD_Unbrick_Bootable.img \
            bs=1024 seek=8 conv=notrunc

          ls -lh R69_SD_Unbrick_Bootable.img

      - name: 7. Upload Bootloader Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: R69-EMCP-v2-Bootloader-Package
          path: |
            u-boot-r69/u-boot-sunxi-with-spl.bin
            u-boot-r69/R69_SD_Unbrick_Bootable.img
