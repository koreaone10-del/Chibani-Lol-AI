      - name: 1. Install ARM Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            libc6-dev bison flex bc device-tree-compiler \
            libssl-dev python3

      - name: 2. Clone U-Boot 2019.01 & Fix dtc yylloc
        run: |
          git clone --depth 1 -b v2019.01 https://github.com/u-boot/u-boot.git u-boot-r69
          cd u-boot-r69
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c* || true

      - name: 3. Configure R69-EMCP v2.0 (336MHz RAM & ZQ=0x003939f9)
        run: |
          cd u-boot-r69
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- orangepi_one_defconfig
          sed -i 's/CONFIG_DRAM_CLK=.*/CONFIG_DRAM_CLK=336/' .config
          sed -i 's/CONFIG_DRAM_ZQ=.*/CONFIG_DRAM_ZQ=3750393/' .config

      - name: 4. Compile u-boot-sunxi-with-spl.bin (بدون binman)
        run: |
          cd u-boot-r69
          # بناء الملفين فقط — تخطي binman نهائياً
          make -j$(nproc) \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            HOSTCC="gcc -O2 -idirafter /usr/include -idirafter /usr/include/x86_64-linux-gnu -fcommon" \
            HOSTLDFLAGS="-fcommon" \
            u-boot.bin spl/sunxi-spl.bin

          # تجميع الصورة يدوياً بنفس تخطيط binman الرسمي لـ sunxi:
          dd if=/dev/zero of=u-boot-sunxi-with-spl.bin bs=1024 count=1016
          dd if=spl/sunxi-spl.bin of=u-boot-sunxi-with-spl.bin bs=1024 seek=8  conv=notrunc
          dd if=u-boot.bin      of=u-boot-sunxi-with-spl.bin bs=1024 seek=32 conv=notrunc

          ls -lh u-boot-sunxi-with-spl.bin
